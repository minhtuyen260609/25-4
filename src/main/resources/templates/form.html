<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Todo</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Thêm Todo mới</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/save}" th:object="${todo}" method="post">

                <div class="form-group">
                    <label>Nội dung</label>
                    <input type="text" th:field="*{content}" class="form-control"
                           placeholder="Nhập nội dung công việc">

                    <small class="text-danger"
                           th:if="${#fields.hasErrors('content')}"
                           th:errors="*{content}">
                    </small>
                </div>

                <div class="form-group">
                    <label>Ngày hết hạn</label>
                    <input type="date" th:field="*{dueDate}" class="form-control">

                    <small class="text-danger"
                           th:if="${#fields.hasErrors('dueDate')}"
                           th:errors="*{dueDate}">
                    </small>
                </div>

                <div class="form-group">
                    <label>Trạng thái</label>
                    <input type="text" th:field="*{status}" class="form-control"
                           placeholder="VD: Chưa làm / Đang làm / Hoàn thành">
                </div>

                <div class="form-group">
                    <label>Mức độ ưu tiên</label>
                    <select th:field="*{priority}" class="form-control">
                        <option value="">-- Chọn mức độ --</option>
                        <option value="Thấp">Thấp</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Cao">Cao</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Lưu</button>
                <a th:href="@{/}" class="btn btn-secondary">Quay lại</a>

            </form>
        </div>
    </div>

</div>

</body>
</html>
